<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>BestShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Inline&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Oswald:wght@200..700&family=Pacifico&family=Raleway:ital,wght@0,100..900;1,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Inline&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Pacifico&family=Raleway:ital,wght@0,100..900;1,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<!--  The first section consists of the logo and navigation.
The navigation elements should be highlighted (change of color 
from gray to black) and underlined when the mouse hovers over 
them.
The whole header element, that should contain the navigation, 
has 100% screen width. However, its center (.container) 
has a predefined value of 1352px (space containing the logo
 and navigation). It consists of a heading (h1), a text (p) and a CTA (call to action) 
 button, which is an appropriately styled link.The background should be glued to the 
 bottom of the section as an img element.
 This section contains the heading h2 and three columns with corresponding icons below it.
Circles that are underneath the icons should be created in CSS and positioned appropriately
 - centrally to the center of the vertical axis of the column.

Benefits
This section contains three rows of boxes. 
The picture and description appear alternately - 
an image is on the right, then below - on the left, then on the right again.
The last row has an image separated from the text box.
The background of this entire section is at 100% screen width, 
the rows themselves must fit into the appropriate container.

Pricing
This is the most extensive section consisting of boxes in three columns. Each of them should get exactly the 
same style and then the middle one should be highlighted.
The "Begin" buttons are appropriately styled a links.
The lists in each column contain custom icons that should 
be placed on pseudo-elements ::before.

Contact
The section consists of two columns:
left - header and short text and two additional columns with e-mail and phone icons
right - a form with two text fields, one checkbox (custom-styled) and a "Send" button.
Footer
The smallest section where there is only the company logo (as in section 1) and, 
on the other side, links (a)  to Facebook and Twitter (they should be clickable).
 -->
 <!-- header -->
<header class="header">
    <div class="header__container">
        <a href="#" class="logo">BestShop</a>
        <!-- navigation nav-->
        <nav>
            <ul class="nav__header"> <!--ul -->
                <li class="nav__element"><a href="#whyus">WHY US</a></li>
                <li class="nav__element"><a href="#benefits">BENEFITS</a></li>
                <li class="nav__element"><a href="#prices">PRICES</a></li>
                <li class="nav__element"><a href="#contact">CONTACT</a></li>
            </ul>
        </nav>
    </div>
</header>
<!-- e: header -->

<!-- Statistics section-->
<main>
  <section class="opening">
    <div class="opening__div">
      <h1 class="opening__header">Sell More!</h1>
      <p class="opening__paragraph">Open shop on our platform and increase your sales</p>
      <a href="#" class="btn btn--primary btn--large">Open your shop</a>
    </div>
    <img src="assets/Background.png" alt="" class="opening__image">
  </section>



<!-- footer -->
<footer class="footer">
  <div class="footer__container">
    <div class="footer__info">
      <a href="#" class="logo">BestShop</a>
      <span class="footer__copyright">&#169 2019 BestShop LTD, All Rights Reserved</span>
    </div>
    <div class="footer__icons">
      <a href="#"><img src="assets/Twitter.svg" alt="twitter"/></a>
      <a href="#"><img src="assets/Facebook.svg" alt="facebook"/></a>
    </div>
  </div>
</footer>
<!-- e: footer -->

</body>
</html>
